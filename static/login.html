<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modir — Log in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script>try { if (localStorage.theme === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
</head>
<body class="login">
  <form method="post" action="/login" class="login-box stack">
    <div class="brand"><img src="/favicon.svg" alt="" width="22" height="22"> Modir</div>
    <p class="err" id="err" hidden>Wrong username or password.</p>
    <input name="username" placeholder="Username" autocomplete="username" required autofocus>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" name="remember" checked> Keep me logged in</label>
    <button class="btn primary">Log in</button>
  </form>
  <script>if (new URLSearchParams(location.search).has('error')) document.getElementById('err').hidden = false;</script>
</body>
</html>
